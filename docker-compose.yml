
services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g

      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Dalel123dalel#
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - opensearch-net

  data-loader:
    image: dana0/opensearch-uploader:latest
    container_name: data-loader
    depends_on:
      - opensearch
    volumes:
      - ../Recommendation_system/dataset:/app/dataset
      - ../Recommendation_system/schema:/app/schema
    environment:
      - OPENSEARCH_HOST=http://opensearch:9200
    restart: "no" 
    networks:
      - opensearch-net 

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - opensearch-net

  api:
    image: dana0/backend:latest
    container_name: api-node
    ports:
      - '3008:3008'
    env_file:
      - .env
    environment:
      - PORT=3008
      - OS_URL=http://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - api-data:/usr/src/app  
    networks:
      - opensearch-net

  frontend:
    image: dana0/frontend:latest
    container_name: dalel-frontend
    ports:
      - '5173:5173'
    env_file:
      - .env
    networks:
      - opensearch-net



volumes:
  opensearch-data:
  api-data:

  
networks:
  opensearch-net:
    

